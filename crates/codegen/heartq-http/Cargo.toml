[package]
license = "Apache-2.0"
name = "heartq-http"
version = "0.1.0"
edition.workspace = true
description = "Shared reqwest HTTP clients and User-Agent construction for the heartq CLI."

[dependencies]
reqwest = { workspace = true, features = ["blocking"] }
reqwest-middleware = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
heartq-auth = { workspace = true, features = ["middleware"] }
heartq-sampler = { path = "../heartq-sampler" }
heartq-telemetry = { workspace = true }
heartq-version = { workspace = true }
heartq-workspace = { workspace = true }

[lints]
workspace = true
